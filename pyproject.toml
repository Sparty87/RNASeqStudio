[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseqstudio"
version = "1.0.0"
description = "Self-installing GUI for bulk RNA-seq: alignment, counts, differential expression and pathway analysis"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Serena Spartano", email = "serena.spartano@unicatt.it" }]
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5",
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "pydeseq2>=0.4",
    "gseapy>=1.0",
]
keywords = ["RNA-seq", "DESeq2", "GSEA", "bioinformatics", "GUI"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/serenaspartano/RNAseqStudio"
Issues = "https://github.com/serenaspartano/RNAseqStudio/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.gui-scripts]
rnaseq-studio = "rnaseq_studio:cli"

[tool.setuptools]
py-modules = ["rnaseq_studio"]
